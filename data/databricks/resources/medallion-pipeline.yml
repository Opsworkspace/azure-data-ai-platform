# The medallion pipeline: bronze -> silver -> gold -> vector index.
#
# Relative paths below resolve against THIS file's directory, so the notebooks
# are `../notebooks/...`. The bundle uploads them on deploy and rewrites the
# task paths to wherever they landed in the workspace, which is why no absolute
# `/Repos/...` path appears anywhere in this repository any more.

resources:
  jobs:
    medallion_pipeline:
      name: purple-medallion-pipeline
      description: >-
        Bronze to silver to gold, then rebuild the vector index. Defined as
        source and deployed by CI rather than created in the workspace UI: a
        job defined by clicking is a job nobody can review, reproduce in
        another workspace, or roll back.

      tags:
        environment: ${bundle.target}
        workload: data
        cost_center: CC-0000-PLATFORM
        managed_by: databricks-asset-bundle

      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: ${var.schedule_pause_status}

      # The single most important line in the file. Set higher, two runs of the
      # silver transform can read the same bronze change-feed range and race on
      # the MERGE: the MERGE itself is atomic, but two runs each computing
      # "rows since version N" duplicate work and, if the first run is slow, can
      # apply out of order. If a run overruns its schedule the correct
      # behaviour is to skip the next one, not to start it alongside.
      max_concurrent_runs: 1
      timeout_seconds: 14400

      email_notifications:
        on_failure:
          - ${var.oncall_email}
        no_alert_for_skipped_runs: true

      # Warns without failing. A pipeline that normally takes 20 minutes and
      # suddenly takes 90 is telling you something — usually that volume grew
      # or a join degraded — long before it starts timing out.
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 7200

      job_clusters:
        - job_cluster_key: etl_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.etl_node_type}
            driver_node_type_id: ${var.etl_node_type}
            num_workers: ${var.etl_workers}

            # Required for Unity Catalog: the cluster runs as exactly one
            # identity, so every read and write can be attributed to a
            # principal and per-user grants can be enforced.
            data_security_mode: SINGLE_USER

            # Vectorised C++ engine. Roughly 2x the DBU rate and typically
            # 2-4x faster on scan-and-aggregate work, so cost-neutral to
            # cheaper for ETL. It is a straight loss for UDF-heavy work, which
            # falls back to the JVM — hence not on the embedding cluster.
            runtime_engine: PHOTON

            azure_attributes:
              availability: ${var.etl_availability}
              # Pins exactly the driver to guaranteed capacity. A Spark job
              # survives losing a worker — those tasks re-run elsewhere — but
              # losing the DRIVER kills the run and discards all completed
              # work. One on-demand node buys that protection; every worker
              # stays on spot.
              first_on_demand: 1
              spot_bid_max_price: -1

            spark_conf:
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.databricks.delta.autoCompact.enabled: "true"
              spark.sql.shuffle.partitions: auto

            custom_tags:
              environment: ${bundle.target}
              workload: data
              pipeline: medallion

        - job_cluster_key: embedding_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.embedding_node_type}
            num_workers: ${var.embedding_workers}
            data_security_mode: SINGLE_USER
            # On demand, not spot: this stage is dominated by external
            # embedding API calls, so an evicted worker loses in-flight
            # requests that have already been paid for.
            azure_attributes:
              availability: ON_DEMAND_AZURE
            custom_tags:
              environment: ${bundle.target}
              workload: data
              pipeline: embedding

      tasks:
        - task_key: bronze_ingest
          description: Land raw files into bronze. Never transforms.
          job_cluster_key: etl_cluster
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              table_name: raw_uploads
          timeout_seconds: 3600
          # Ingestion is idempotent and the failures are transient (storage
          # throttling, a spot eviction), so retrying is safe and usually works.
          max_retries: 3
          min_retry_interval_millis: 60000
          # A timeout here means the run is stuck, not slow. Retrying a stuck
          # run just spends another hour arriving at the same place.
          retry_on_timeout: false

        - task_key: silver_transform
          description: >-
            Clean, deduplicate and conform. Quarantines bad rows rather than
            dropping them silently.
          depends_on:
            - task_key: bronze_ingest
          job_cluster_key: etl_cluster
          notebook_task:
            notebook_path: ../notebooks/02_silver_transform.py
            base_parameters:
              catalog: ${var.catalog}
          timeout_seconds: 5400
          max_retries: 2
          min_retry_interval_millis: 120000

        - task_key: gold_aggregate
          description: Build the business aggregates the API and dashboards read.
          depends_on:
            - task_key: silver_transform
          job_cluster_key: etl_cluster
          notebook_task:
            notebook_path: ../notebooks/03_gold_aggregate.py
            base_parameters:
              catalog: ${var.catalog}
          timeout_seconds: 3600
          max_retries: 2

        - task_key: build_vector_index
          description: >-
            Chunk, embed and index. Runs on its own cluster so a long embedding
            run does not hold the larger ETL cluster open.
          depends_on:
            - task_key: gold_aggregate
          job_cluster_key: embedding_cluster
          notebook_task:
            notebook_path: ../notebooks/04_build_vector_index.py
            base_parameters:
              catalog: ${var.catalog}
              index_name: purple-documents
          timeout_seconds: 7200
          max_retries: 1
