# ---------------------------------------------------------------------------
# Images may only come from the platform's own registry.
#
# The supply-chain control. Without it, any pod can pull from Docker Hub,
# quay.io, or an attacker-controlled registry, and the cluster runs code that
# passed through none of the platform's scanning, signing or review.
#
# It also closes a subtler hole: an image pulled from a public registry is not
# subject to the ACR retention or CVE-scanning policy, so it never appears in
# the vulnerability reporting that the platform believes is complete.
# ---------------------------------------------------------------------------
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sallowedrepos
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedRepos
      validation:
        openAPIV3Schema:
          type: object
          properties:
            repos:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sallowedrepos

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          satisfied := [good | repo := input.parameters.repos[_]; good := startswith(container.image, repo)]
          not any(satisfied)
          msg := sprintf(
            "Image <%v> is not from an approved registry. Approved: %v",
            [container.image, input.parameters.repos]
          )
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.initContainers[_]
          satisfied := [good | repo := input.parameters.repos[_]; good := startswith(container.image, repo)]
          not any(satisfied)
          msg := sprintf(
            "Init container image <%v> is not from an approved registry.",
            [container.image]
          )
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: only-platform-registry
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
      - azure-arc
      - kube-node-lease
      - kube-public
  parameters:
    repos:
      # The platform's own geo-replicated registry.
      - "purpleplatprodeus2acr"
      # Microsoft Container Registry, for the AKS add-ons the platform does
      # not build itself.
      - "mcr.microsoft.com/"
