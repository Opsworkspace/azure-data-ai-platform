# ---------------------------------------------------------------------------
# SecretProviderClass — Key Vault secrets as files, not as Kubernetes Secrets.
#
# Why not just use a Kubernetes Secret?
#
# A Secret is base64-encoded, not encrypted, and stored in etcd. Anyone with
# `get secrets` in the namespace can read every value. Anyone with etcd access
# reads them all. They do not rotate: changing the value in Key Vault does
# nothing until someone recreates the Secret and restarts the pods. And the
# manifest that creates one has to come from somewhere, which usually means a
# secret in git or a secret in a pipeline variable.
#
# The CSI driver instead fetches from Key Vault at pod start, using the
# driver's own managed identity, and projects the values as files on a
# tmpfs volume that exists only for that pod's lifetime.
#
# `secret_rotation_enabled = true` in the AKS module polls every two minutes
# and updates the mounted file in place. Note the limit of that: the FILE
# updates automatically, but a value already read into an environment variable
# does NOT — environment variables are fixed at process start. An application
# that needs live rotation must read the file, not the variable.
#
# `secretObjects` below syncs to a Kubernetes Secret anyway, for the one case
# that needs it: the App Insights connection string is consumed by the Azure
# Monitor SDK through an environment variable it reads at import time. That is
# a deliberate, documented exception rather than the default path.
# ---------------------------------------------------------------------------
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: purple-keyvault
  namespace: purple
spec:
  provider: azure

  # Sync selected mounted files into a Kubernetes Secret. Only the values that
  # genuinely must be environment variables belong here; everything else stays
  # a file and never enters etcd.
  secretObjects:
    - secretName: purple-appinsights
      type: Opaque
      data:
        - objectName: appinsights-connection-string
          key: connection-string

  parameters:
    usePodIdentity: "false"
    # Workload identity, matching the rest of the platform.
    clientID: "00000000-0000-0000-0000-000000000000" # patched per environment
    keyvaultName: "PLACEHOLDER-KV" # patched per environment
    tenantId: "00000000-0000-0000-0000-000000000000" # patched per environment

    objects: |
      array:
        - |
          objectName: appinsights-connection-string
          objectType: secret
          objectVersion: ""
