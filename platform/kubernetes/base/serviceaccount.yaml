# ---------------------------------------------------------------------------
# Service accounts — the Kubernetes half of workload identity federation.
#
# The annotation is the whole mechanism. `azure.workload.identity/client-id`
# tells the Azure Workload Identity webhook which managed identity this pod's
# token should be exchanged for. The Azure half — the federated credential
# that trusts `system:serviceaccount:purple:purple-api` — is created by
# infra/terraform/modules/identity.
#
# BOTH halves must agree exactly. A mismatch produces AADSTS70021
# ("No matching federated identity record found") at runtime, and the error
# names neither the namespace nor the service account, so it is worth checking
# them character by character.
#
# The client id is NOT a secret. It is a public identifier. What is secret is
# the pod's projected token, which lives only in the pod's filesystem, expires
# hourly, and is bound to this specific service account.
#
# `automountServiceAccountToken: false` on the pod spec, combined with the
# webhook's explicit projected volume, means the token is mounted with a
# deliberate audience and lifetime rather than the legacy never-expiring one.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: purple-api
  namespace: purple
  labels:
    app.kubernetes.io/name: purple-api
    app.kubernetes.io/part-of: purple
  annotations:
    # Replaced per environment by Kustomize. The all-zero placeholder is
    # invalid as an Azure client id, so if it ever reaches a real cluster the
    # token exchange fails loudly instead of binding to the wrong identity.
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
    # How long the projected token is valid. One hour is the default and is
    # short enough that a leaked token has limited value.
    azure.workload.identity/service-account-token-expiration: "3600"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: purple-worker
  namespace: purple
  labels:
    app.kubernetes.io/name: purple-worker
    app.kubernetes.io/part-of: purple
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
    azure.workload.identity/service-account-token-expiration: "3600"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: purple-diagnostics
  namespace: purple-system
  labels:
    app.kubernetes.io/name: purple-diagnostics
    app.kubernetes.io/part-of: purple
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
automountServiceAccountToken: false
