name: validate

# Credential-free by design. This workflow has no access to any Azure identity,
# which is what mechanically prevents it from planning or applying anything.
# See docs/00-safety-and-placeholders.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.9.8"

jobs:
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check canonical formatting
        run: terraform fmt -recursive -check -diff infra/

      - name: Initialise and validate every Terraform directory
        run: |
          set -euo pipefail
          # -backend=false: never contacts a remote state backend, so no
          # credentials are needed and no state can be read or written.
          mapfile -t dirs < <(find infra/terraform -type f -name '*.tf' \
            -exec dirname {} \; | sort -u)
          for d in "${dirs[@]}"; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false -no-color
            terraform -chdir="$d" validate -no-color
            echo "::endgroup::"
          done

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive --minimum-failure-severity=warning --format compact

  python:
    name: ruff + mypy + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/requirements-dev.txt
      - run: ruff check services/ data/
      - run: ruff format --check services/ data/
      - run: mypy services/
      - run: pytest services/ -q

  kubernetes:
    name: kube-linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -sS "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s 5.5.0
          sudo mv kustomize /usr/local/bin/
      - name: Render the production overlay
        # Lint the RENDERED output, never the base. The base carries
        # PLACEHOLDER image names and unpatched replica counts that an overlay
        # replaces, so linting it reports problems that exist in nothing that
        # would ever be applied — which is precisely why this job used to fail
        # while `make lint-k8s` passed. This now matches the Makefile.
        run: |
          mkdir -p rendered
          kustomize build platform/kubernetes/overlays/prod > rendered/prod.yaml
      - uses: stackrox/kube-linter-action@v1
        with:
          directory: rendered
          config: .kube-linter.yaml

  databricks:
    name: bundle schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: databricks/setup-cli@main
      - name: Check the bundle against the CLI schema
        # `databricks bundle validate` authenticates before it resolves
        # anything, so it cannot run here: this workflow is granted no Azure
        # or Databricks identity, which is what mechanically prevents it from
        # deploying. What is checkable offline is that the YAML parses and
        # that every key exists in the schema of the installed CLI.
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python tools/check_bundle_schema.py
