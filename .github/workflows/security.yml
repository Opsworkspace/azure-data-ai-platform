name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Re-scan weekly: new CVEs and new detection rules appear after merge.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still a leak.
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan the full history for secrets
        # The binary rather than gitleaks/gitleaks-action@v2, which requires a
        # paid licence for repositories owned by an ORGANISATION and fails with
        # "missing gitleaks license" on this one. gitleaks itself is MIT and
        # has no such restriction, so this runs exactly the scan `make secrets`
        # runs — and removes a hosted action from the supply chain of a
        # security check, which is worth something on its own.
        run: gitleaks detect --config .gitleaks.toml --redact --verbose

  placeholders:
    name: placeholder-leak guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check_placeholders.sh

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          # Directory and framework now come from .checkov.yaml, so the scan
          # CI runs and the scan `make checkov` runs cannot drift apart. Every
          # skip in that file carries the reason it exists.
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

  trivy:
    name: trivy config + filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan IaC for misconfiguration
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-config.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
